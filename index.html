<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direto ao ponto - Blog</title>
    <!-- Importando uma fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Fundo cinza azulado bem suave */
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1c256e 0%, #2b3a99 100%); /* Degradê azul escuro */
            color: #ffffff; 
            text-align: center;
            max-width: 800px;
            margin: 0 auto 24px auto;
            padding: 32px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(28, 37, 110, 0.15);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            color: #C1DFFF;
            font-size: 1.05rem;
        }

        main {
            background-color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Sombra suave */
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        img {
            width: 90px;
            height: 90px;
            border-radius: 50%; /* Garante que a logo fique perfeitamente redonda */
            object-fit: cover;
            border: 3px solid #C1DFFF;
            flex-shrink: 0; /* Impede a imagem de esmagar em telas pequenas */
        }

        .post-conteudo h2 {
            color: #1c256e;
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .autor {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .texto-post {
            color: #334155;
            margin-bottom: 20px;
        }

        button {
            background-color: #fff0f1;
            color: #e63946;
            border: 1px solid #ffcdd2;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease; /* Animação suave */
        }

        button:hover {
            background-color: #e63946;
            color: #ffffff;
            transform: translateY(-2px); /* Levanta levemente o botão */
            box-shadow: 0 4px 8px rgba(230, 57, 70, 0.25);
        }

        button:active {
            transform: scale(0.95); /* Efeito de clique */
        }

        /* Adaptação para celulares */
        @media (max-width: 600px) {
            main {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Direto ao ponto</h1>
        <p>Mostrar que seu carro não é um bicho de 7 cabeças e coisas sobre carros</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="Logo circular com fundo escuro exibindo a parte dianteira de um carro esportivo vermelho. Uma flecha branca em diagonal corta o centro da imagem, apontando para cima e para a direita. Abaixo do veículo, está escrito em letras maiúsculas brancas o texto DIRETO AO PONTO">
        
        <div class="post-conteudo"> 
            <h2>Meu primeiro post</h2>
            <p class="autor">Por Arthur Udovicc</p>
            <p class="texto-post">Boas-vindas ao meu site! Aqui vou compartilhar dicas sobre carros e curiosidades sobre a área.</p>      
            <button>❤️ <span>0</span></button>
            <button>👍 <span>0</span></button>
        </div>
    </main>

    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    </script>
</body>
</html>
